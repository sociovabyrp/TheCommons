<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Hind:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F0FF;--card:#FFFFFF;--ink:#1A1033;--text:#1A1033;--muted:#5E5380;--line:#1A1033;
  --yellow:#FFC700;--orange:#FF7A2F;--cyan:#19D3E0;--pink:#FF5AA5;--lime:#A6F04B;--violet:#B69CFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#150D2E;--card:#22174A;--text:#F4F0FF;--muted:#B5A9D9;--line:#F4F0FF;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#150D2E;--card:#22174A;--text:#F4F0FF;--muted:#B5A9D9;--line:#F4F0FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 Hind,system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 56px}
header{padding:40px 0 10px;position:relative}
.mark{font:800 clamp(44px,12vw,84px)/.92 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:0;cursor:pointer;color:var(--text);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--yellow)}
.mark span{display:block}
.sticker{display:inline-block;margin-top:26px;background:var(--lime);color:#1A1033;border:3px solid var(--line);border-radius:999px;padding:4px 16px;font:700 15px "Bricolage Grotesque",sans-serif;transform:rotate(-3deg);box-shadow:4px 4px 0 var(--line)}
.tag{margin:16px 0 0;color:var(--muted);max-width:44ch;font-size:18px}
.search{margin:22px 0 8px}
.search input{width:100%;font:500 17px Hind,sans-serif;padding:14px 18px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);box-shadow:5px 5px 0 var(--line)}
.search input::placeholder{color:var(--muted)}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:28px}
.shelf{display:flex;flex-direction:column;justify-content:space-between;min-height:176px;text-decoration:none;background:var(--tone);color:#1A1033;border:3px solid var(--line);border-radius:20px;padding:20px;box-shadow:6px 6px 0 var(--line);transition:transform .12s,box-shadow .12s}
.shelf:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--line)}
.shelf:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--line)}
.shelf h2{font:800 30px/1 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
.shelf p{margin:6px 0 0;font-weight:500}
.shelf .row2{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.chip{background:#1A1033;color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.go{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #1A1033;display:grid;place-items:center}
.back{display:inline-block;margin:26px 0 16px;color:var(--text);font-weight:600;text-decoration:none;border:3px solid var(--line);border-radius:999px;padding:4px 16px;background:var(--card);box-shadow:3px 3px 0 var(--line)}
.hd{background:var(--tone);color:#1A1033;border:3px solid var(--line);border-radius:20px;padding:22px;box-shadow:6px 6px 0 var(--line)}
.hd h1{font:800 clamp(34px,8vw,52px)/1 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.02em}
.hd p{margin:6px 0 0;font-weight:500}
h1.res{font:800 clamp(30px,7vw,44px)/1.1 "Bricolage Grotesque",sans-serif;margin:30px 0 4px}
.sub{color:var(--muted);margin:0 0 6px}
.list{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:20px}
.item{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:20px 20px 22px;box-shadow:5px 5px 0 var(--line)}
.item h3{font:700 24px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.item small{color:var(--muted);font-size:15px}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:18px;margin-top:18px}
.view{display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:#1A1033;font:700 18px "Bricolage Grotesque",sans-serif;text-decoration:none;padding:11px 24px;border:3px solid #1A1033;border-radius:999px;box-shadow:4px 4px 0 var(--line);transition:transform .1s,box-shadow .1s}
.view:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.view:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.dl{display:inline-flex;align-items:center;gap:8px;color:var(--text);font-weight:600;text-decoration:none;padding:6px 2px;border-bottom:3px solid var(--cyan)}
.dl:hover{background:var(--cyan);color:#1A1033}
.soon{display:inline-block;border:3px dashed var(--line);border-radius:999px;padding:6px 18px;font-weight:600;color:var(--muted)}
.empty{color:var(--muted);padding:26px 0;font-weight:500}
footer{margin-top:54px;color:var(--muted);font-size:14px;border-top:3px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 class="mark" id="home" role="link" tabindex="0"><span>THE</span><span>COMMONS</span></h1>
  <div class="sticker">Free CBSE PDFs</div>
  <p class="tag">Notes and worksheets for Classes 9 to 12. Tap View to read or Download to keep.</p>
  <div class="search"><input id="q" type="search" placeholder="Search a chapter, topic or worksheet" aria-label="Search"></div>
</header>
<main id="app"></main>
<footer>THE COMMONS by Sociova. Free CBSE notes PDF for Class 9 and 10 Social Science, Class 11 and 12 Political Science.</footer>
</div>
<script>
/* ===== EDIT HERE: add your material below =====
   shelf: class9 | class10 | class11 | class12 | worksheets | misc
   type : Notes, PDF, Worksheet, etc.
   url  : "notes/file-name.pdf" (PDF uploaded in the notes folder) OR a Google Drive share link. Leave "" for "Coming soon". */
var ITEMS=[
 {shelf:"class9",title:"The French Revolution",type:"Notes",url:""},
 {shelf:"class9",title:"What is Democracy? Why Democracy?",type:"Notes",url:""},
 {shelf:"class10",title:"Power Sharing",type:"Notes",url:""},
 {shelf:"class11",title:"Constitution: Why and How?",type:"Notes",url:""},
 {shelf:"class12",title:"Challenges of Nation Building",type:"Notes",url:""},
 {shelf:"worksheets",title:"Day 1: History (Class 10 daily mock test)",type:"Worksheet",url:""},
 {shelf:"misc",title:"Exam tips and answer writing",type:"Guide",url:""}
];
var SHELVES=[
 {id:"class9",name:"Class 9",sub:"Social Science",tone:"var(--yellow)"},
 {id:"class10",name:"Class 10",sub:"Social Science",tone:"var(--orange)"},
 {id:"class11",name:"Class 11",sub:"Political Science",tone:"var(--cyan)"},
 {id:"class12",name:"Class 12",sub:"Political Science",tone:"var(--pink)"},
 {id:"worksheets",name:"Worksheets",sub:"Practice and daily tests",tone:"var(--lime)"},
 {id:"misc",name:"Miscellaneous",sub:"Guides, tips and extras",tone:"var(--violet)"}
];
var EYE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>';
var DOWN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>';
var ARROW='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1033" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>';
var app=document.getElementById("app"),q=document.getElementById("q");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shelfOf(id){return SHELVES.filter(function(s){return s.id===id})[0]}
function did(u){var m=u.match(/drive\.google\.com\/file\/d\/([^\/?]+)/);return m?m[1]:""}
function dl(u){var d=did(u);return d?"https://drive.google.com/uc?export=download&id="+d:u}
function pv(u){var d=did(u);return d?"https://drive.google.com/file/d/"+d+"/preview":u}
function row(it,showShelf){
  var s=shelfOf(it.shelf),meta=it.type+(showShelf&&s?" in "+s.name+", "+s.sub:"");
  var b=it.url?'<a class="view" href="'+esc(pv(it.url))+'" target="_blank" rel="noopener">'+EYE+'View</a><a class="dl" href="'+esc(dl(it.url))+'" download target="_blank" rel="noopener">Download '+DOWN+'</a>':'<span class="soon">Coming soon</span>';
  return '<li class="item"><h3>'+esc(it.title)+'</h3><small>'+esc(meta)+'</small><div class="acts">'+b+'</div></li>';
}
function home(){
  app.innerHTML='<div class="grid">'+SHELVES.map(function(s){
    var n=ITEMS.filter(function(i){return i.shelf===s.id&&i.url}).length;
    return '<a class="shelf" style="--tone:'+s.tone+'" href="#'+s.id+'"><div><h2>'+esc(s.name)+'</h2><p>'+esc(s.sub)+'</p></div><div class="row2"><span class="chip">'+(n?n+" ready":"Being added")+'</span><span class="go">'+ARROW+'</span></div></a>';
  }).join("")+'</div>';
}
function shelf(id){
  var s=shelfOf(id);if(!s)return home();
  var items=ITEMS.filter(function(i){return i.shelf===id});
  app.innerHTML='<a class="back" href="#">Back to all shelves</a><div class="hd" style="--tone:'+s.tone+'"><h1>'+esc(s.name)+'</h1><p>'+esc(s.sub)+'</p></div>'+
  (items.length?'<ul class="list">'+items.map(function(i){return row(i,false)}).join("")+'</ul>':'<p class="empty">Nothing here yet. Check back soon.</p>');
}
function search(t){
  var k=t.toLowerCase(),r=ITEMS.filter(function(i){return(i.title+" "+i.type).toLowerCase().indexOf(k)>-1});
  app.innerHTML='<h1 class="res">Search results</h1><p class="sub">'+r.length+' found for "'+esc(t)+'"</p>'+
  (r.length?'<ul class="list">'+r.map(function(i){return row(i,true)}).join("")+'</ul>':'<p class="empty">No match. Try a shorter word.</p>');
}
function route(){var h=location.hash.replace("#","");q.value="";h?shelf(h):home();}
q.addEventListener("input",function(){var t=q.value.trim();if(t)search(t);else route();});
function goHome(){q.value="";if(location.hash)location.hash="";else home();}
var m=document.getElementById("home");m.addEventListener("click",goHome);
m.addEventListener("keydown",function(e){if(e.key==="Enter")goHome()});
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
